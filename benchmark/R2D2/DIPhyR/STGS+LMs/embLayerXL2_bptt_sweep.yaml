project: PromptOptimisationSTGS 
entity: kevin-near32-org
program: main.py
command:
  - ${env}
  - ../venv/bin/python
  - ${program}
  - ${args}
method: bayes
early_terminate:
  min_iter: 500
  eta: 3 
  type: hyperband
  strict: True
metric:
  name: crossentropy
  goal: minimize 
parameters:
  model_name:
    values: ["HuggingFaceTB/SmolLM-135M"]
  target_text:
    values: ["The quick brown fox jumps over the lazy dog"]
  pre_prompt:
    values: [None]
  max_gradient_norm:
    values: [0.0, 1.0, 5.0, 10.0]
  losses:
    values: ["crossentropy+embLayer0+5+10+15+20+25+30L2","crossentropy+embLayer0+10+20+30L2","crossentropy+embLayer0+1+2+3+4L2","crossentropy+embLayer5+6+7+8+9L2","crossentropy+embLayer10+11+12+13+14L2","crossentropy+embLayer15+16+17+18+19L2","crossentropy+embLayer20+21+22+23+24L2","crossentropy+embLayer25+26+27+28+29+30L2",]
  seq_len:
    values: [10,20,40,100]
  epochs:
    values: [4000]
  eps:
    values: [1e-20, 1e-12, 1e-8]
  temperature:
    values: [1e0, 0.1, 0.01, 0.001, 1e1, 1e2, 1e3]
  learnable_temperature:
    values: [False, True]
  stgs_hard:
    values: [False, True]
  bptt:
    values: [False, True]
  bptt_eps:
    values: [1e-20, 1e-12, 1e-8]
  bptt_temperature:
    values: [1e0, 0.1, 0.01, 0.001, 1e1, 1e2, 1e3]
  bptt_learnable_temperature:
    values: [False, True]
  bptt_stgs_hard:
    values: [False, True]
  bptt_hidden_state_conditioning:
    values: [False, True]
  plot_every:
    values: [100000]
  filter_vocab:
    values: [ True]
  vocab_threshold:
    values: [-1]
  seed:
    values: [10, 20, 30, 40, 50]
  batch_size:
    values: [16,32,64,92,128]
  learning_rate:
    values: [1.0e-2, 1.0e-3, 1.0e-4]
                   
