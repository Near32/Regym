project: PromptOptimisationSTGS 
entity: kevin-near32-org
program: batch_optimize_main.py
command:
  - ${env}
  - ../venv/bin/python
  - ${program}
  - ${args}
method: grid
metric:
  name: loss
  goal: minimize 
parameters:
  dataset_path:
    values: ["./data/distilgpt2_diverse_targets_k1-5-21.json"]
  output_dir:
    values: ["results/distilgpt2_grid_sweep_bert_lr0.1_PL10-20-40-80"]
  model_name:
    values: ["distilbert/distilgpt2"]
  model_precision:
    values: ["full"]
  gradient_checkpointing:
    values: ["False"]
  max_gradient_norm:
    values: [0.0]
  metric_groups:
    values: ["basic,semantic,distribution"]
  sentencebert_model:
    values: ["all-MiniLM-L6-v2"]
  bertscore_model:
    values: ["distilbert-base-uncased"]
  losses:
    values: ["embxentropy", "crossentropy"]
  complLambda:
    values: [0.0]
  promptLambda:
    values: [0.0]
  seq_len:
    values: [10, 20, 40, 80]
  epochs:
    values: [4000]
  eps:
    values: [1e-10]
  temperature:
    values: [1e3]
  learnable_temperature:
    values: [True, False]
  stgs_hard:
    values: [False]
  bptt:
    values: [False]
  bptt_eps:
    values: [1e-20]
  bptt_temperature:
    values: [1e3]
  bptt_learnable_temperature:
    values: [False]
  bptt_stgs_hard:
    values: [False]
  bptt_hidden_state_conditioning:
    values: [False]
  plot_every:
    values: [100000]
  filter_vocab:
    values: [ True]
  vocab_threshold:
    values: [-1]
  seed:
    values: [10, 20, 30, 40, 50]
  batch_size:
    values: [1]
  learning_rate:
    values: [1.0e-1]
                   
